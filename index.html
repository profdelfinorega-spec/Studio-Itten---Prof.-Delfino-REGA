        // --- FUNZIONE DI SUPPORTO GENERICA PER LE CHIAMATE API GEMINI (Con Backoff Esponenziale integrato) ---
        const callGemini = async (prompt, systemInstruction = "", schema = null, base64Image = null) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            let contentsParts = [];
            if (base64Image) {
                contentsParts.push({
                    inlineData: {
                        mimeType: "image/png",
                        data: base64Image
                    }
                });
            }
            contentsParts.push({ text: prompt });

            const payload = {
                contents: [{ role: "user", parts: contentsParts }]
            };

            if (systemInstruction) {
                payload.systemInstruction = {
                    parts: [{ text: systemInstruction }]
                };
            }

            if (schema) {
                payload.generationConfig = {
                    responseMimeType: "application/json",
                    responseSchema: schema
                };
            }

            let delay = 1000;
            for (let attempt = 0; attempt < 5; attempt++) {
                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) {
                        const result = await response.json();
                        return result;
                    }
                } catch (err) {
                    // Fail silente conformemente alla linea guida sul backoff esponenziale
                }
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2;
            }
            throw new Error("Impossibile connettersi al Server AI dell'Atelier. Riprova più tardi.");
        };

        // --- COMPONENTE APPLICAZIONE PRINCIPALE ---
        function App() {
            const [nickname, setNickname] = useState('');
            const [view, setView] = useState('registration'); 
            const [level, setLevel] = useState(0);
            const [score, setScore] = useState(0);
            const [feedback, setFeedback] = useState(null);
            const [leaderboard, setLeaderboard] = useState(MOCK_LEADERBOARD_INITIAL);

            // Stati AI e Canvas
            const [aiBrandDescription, setAiBrandDescription] = useState('');
            const [aiMood, setAiMood] = useState('Energia e Innovazione');
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [aiResponse, setAiResponse] = useState(null);
            const [aiError, setAiError] = useState(null);
            const [copiedIndex, setCopiedIndex] = useState(null);

            const [safetyCategory, setSafetyCategory] = useState('Divieto');
            const [safetyScenario, setSafetyScenario] = useState('');
            const [isSafetyLoading, setIsSafetyLoading] = useState(false);
            const [safetyResponse, setSafetyResponse] = useState(null);
            const [safetyError, setSafetyError] = useState(null);

            const [chatMessages, setChatMessages] = useState([
                { sender: 'ai', text: "Ciao! Sono il tuo Tutor Virtuale dell'Atelier. Chiedimi pure qualsiasi cosa sui 7 contrasti di Itten, sulla scomposizione ottica, sulla psicologia cromatico-emotiva o su come i grandi brand scelgono le loro palette!" }
            ]);
            const [chatInput, setChatInput] = useState('');
            const [isChatLoading, setIsChatLoading] = useState(false);
            const chatEndRef = useRef(null);

            const [isDrawingEmojiLoading, setIsDrawingEmojiLoading] = useState(false);
            const [emojiResponse, setEmojiResponse] = useState(null);
            const [emojiError, setEmojiError] = useState(null);

            const saveScoreToLeaderboard = async (finalScore) => {
                const newEntry = { id: 'studente-temp', nickname: nickname || 'Studente', score: finalScore };
                setLeaderboard(prev => {
                    const filtered = prev.filter(e => e.id !== 'studente-temp');
                    return [...filtered, newEntry].sort((a, b) => b.score - a.score).slice(0, 10);
                });

                if (!auth?.currentUser || !db) return;
                try {
                    const lbRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('leaderboard').doc(auth.currentUser.uid);
                    await lbRef.set({
                        nickname: nickname,
                        score: finalScore,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (err) {
                    console.warn("Classifica salvata localmente.");
                }
            };

            const handleRegister = (e, chosenNickname) => {
                e.preventDefault();
                const clean = chosenNickname.trim();
                if (!clean) return;
                setNickname(clean);
                setView('menu');
            };

            const startGame = () => {
                setView('playing');
                setLevel(0);
                setScore(0);
                setFeedback(null);
            };

            const nextLevel = () => {
                if (level < LEVELS_DATA.length - 1) {
                    setLevel(level + 1);
                    setFeedback(null);
                } else {
                    saveScoreToLeaderboard(score);
                    setView('end');
                }
            };

            const showFeedback = (isCorrect, message, points = 100) => {
                setFeedback({ isCorrect, message });
                if (isCorrect) setScore(s => s + points);
                setTimeout(() => {
                    if (isCorrect) nextLevel();
                    else setFeedback(null);
                }, 4500);
            };

            // --- CHIAMATE GEMINI AI (Ora ottimizzate con callGemini) ---
            const handleGenerateAIPalette = async () => {
                if (!aiBrandDescription.trim()) return;
                setIsAiLoading(true);
                setAiError(null);
                setAiResponse(null);

                const promptText = `Crea un'analisi cromatico-psicologica completa basata su Itten e sulla psicologia del marketing per il brand: "${aiBrandDescription}". Mood: "${aiMood}". Genera output in formato JSON strutturato con: "paletteName", "colors" (array di 4 elementi con hex, name, role, psychology), "ittenContrast", "marketingExplanation", "uxTip".`;
                const schema = {
                    type: "OBJECT",
                    properties: {
                        paletteName: { type: "STRING" },
                        colors: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    hex: { type: "STRING" },
                                    name: { type: "STRING" },
                                    role: { type: "STRING" },
                                    psychology: { type: "STRING" }
                                },
                                required: ["hex", "name", "role", "psychology"]
                            }
                        },
                        ittenContrast: { type: "STRING" },
                        marketingExplanation: { type: "STRING" },
                        uxTip: { type: "STRING" }
                    },
                    required: ["paletteName", "colors", "ittenContrast", "marketingExplanation", "uxTip"]
                };

                try {
                    const result = await callGemini(
                        promptText,
                        "Sei un assistente AI specializzato nella teoria del colore di Itten, design UX/UI e psicologia del marketing. Rispondi esclusivamente in italiano in formato JSON valido.",
                        schema
                    );
                    const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    setAiResponse(JSON.parse(rawText));
                } catch (err) {
                    setAiError(err.message || "Errore di connessione con il servizio AI.");
                } finally {
                    setIsAiLoading(false);
                }
            };

            const handleGenerateSafetySign = async () => {
                if (!safetyScenario.trim()) return;
                setIsSafetyLoading(true);
                setSafetyError(null);
                setSafetyResponse(null);

                const promptText = `Crea un cartello stradale o di sicurezza per: "${safetyScenario}", Categoria: "${safetyCategory}". Rispondi in JSON strutturato con: "signTitle", "regulatoryCategory", "shape" (triangle, circle, square, rectangle), "bgColor", "borderColor", "textColor", "symbolPath" (stringa pulita del parametro d di un path SVG per viewBox 0 0 100 100), "symbolDescription", "behavioralRule", "technicalStandards".`;
                const schema = {
                    type: "OBJECT",
                    properties: {
                        signTitle: { type: "STRING" },
                        regulatoryCategory: { type: "STRING" },
                        shape: { type: "STRING" },
                        bgColor: { type: "STRING" },
                        borderColor: { type: "STRING" },
                        textColor: { type: "STRING" },
                        symbolPath: { type: "STRING" },
                        symbolDescription: { type: "STRING" },
                        behavioralRule: { type: "STRING" },
                        technicalStandards: { type: "STRING" }
                    },
                    required: ["signTitle", "regulatoryCategory", "shape", "bgColor", "borderColor", "textColor", "symbolPath", "symbolDescription", "behavioralRule", "technicalStandards"]
                };

                try {
                    const result = await callGemini(
                        promptText,
                        "Sei un ingegnere della sicurezza sui luoghi di lavoro ed esperto del Codice della Strada italiano. Generi segnali stradali e di sicurezza conformi alla norma UNI EN ISO 7010 in formato JSON strutturato, disegnando un pigtogramma SVG personalizzato. Rispondi in italiano in formato JSON valido.",
                        schema
                    );
                    const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    setSafetyResponse(JSON.parse(rawText));
                } catch (err) {
                    setSafetyError(err.message || "Errore durante la generazione del cartello.");
                } finally {
                    setIsSafetyLoading(false);
                }
            };

            const handleSendChatMessage = async () => {
                if (!chatInput.trim() || isChatLoading) return;
                const userMessage = chatInput;
                setChatMessages(prev => [...prev, { sender: 'user', text: userMessage }]);
                setChatInput('');
                setIsChatLoading(true);

                const promptText = `L'utente dice: "${userMessage}". Rispondi in italiano come Johannes Itten o docente d'arte del Bauhaus. Massimo 4 frasi d'impatto.`;
                try {
                    const result = await callGemini(
                        promptText,
                        "Sei un professore universitario di Arti Visive ed esperto dei 7 contrasti cromatici di Johannes Itten, della psicologia del marketing legata al colore e del design UX/UI."
                    );
                    const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    setChatMessages(prev => [...prev, { sender: 'ai', text }]);
                } catch (err) {
                    setChatMessages(prev => [...prev, { sender: 'ai', text: err.message || "Errore di connessione con il Bauhaus." }]);
                } finally {
                    setIsChatLoading(false);
                }
            };

            const handleAnalyzeEmojiDrawing = async (base64Png) => {
                setIsDrawingEmojiLoading(true);
                setEmojiError(null);
                setEmojiResponse(null);

                const promptText = `Analizza questo disegno di emoji. Fornisci un output JSON strutturato con: "emojiName", "svgOutput" (codice SVG valido per viewBox 0 0 100 100), "detectedColors" (array), "ittenAnalysis", "psychologicalProfile".`;
                const schema = {
                    type: "OBJECT",
                    properties: {
                        emojiName: { type: "STRING" },
                        svgOutput: { type: "STRING" },
                        detectedColors: { type: "ARRAY", items: { type: "STRING" } },
                        ittenAnalysis: { type: "STRING" },
                        psychologicalProfile: { type: "STRING" }
                    },
                    required: ["emojiName", "svgOutput", "detectedColors", "ittenAnalysis", "psychologicalProfile"]
                };

                try {
                    const result = await callGemini(
                        promptText,
                        "Sei un illustratore esperto di icone digitali, specialista di psicologia del colore applicata alle emoji e docente d'arte della scuola del Bauhaus. Rispondi in italiano in formato JSON valido.",
                        schema,
                        base64Png
                    );
                    const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                    setEmojiResponse(JSON.parse(rawText));
                } catch (err) {
                    setEmojiError(err.message || "Analisi del disegno fallita.");
                } finally {
                    setIsDrawingEmojiLoading(false);
                }
            };

            return (
                <div className="flex flex-col min-h-screen justify-between bg-slate-50">
                    <div>
                        {/* HEADER GLOBALE */}
                        <header className="bg-white shadow-sm p-4 sticky top-0 z-10 border-b border-slate-100">
                            <div className="max-w-4xl mx-auto flex justify-between items-center">
                                <div className="flex flex-col cursor-pointer" onClick={() => nickname && setView('menu')}>
                                    <div className="flex items-center gap-2">
                                        <Icon.Palette />
                                        <h1 className="text-xl font-black bg-clip-text text-transparent bg-gradient-to-r from-red-500 via-yellow-500 to-blue-500">
                                            L'Atelier di Itten
                                        </h1>
                                    </div>
                                    <span className="text-[10px] sm:text-xs font-bold text-slate-500 mt-1 uppercase tracking-wider bg-slate-50 px-2 py-0.5 rounded border border-slate-100 self-start">
                                        Materiale didattico Prof. Delfino REGA
                                    </span>
                                </div>
                                
                                <div className="flex items-center gap-4">
                                    {view === 'playing' && (
                                        <div className="flex items-center gap-4 font-semibold text-slate-600">
                                            <span>Sfida {level + 1}/{LEVELS_DATA.length}</span>
                                            <span className="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full text-sm">
                                                Punti: {score}
                                            </span>
                                        </div>
                                    )}
                                    {nickname && view !== 'playing' && (
                                        <div className="flex items-center gap-2 text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full">
                                            <Icon.User /> {nickname}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </header>

                        {/* COMPONENTE INTERFACCIA PRINCIPALE */}
                        <main className="max-w-4xl mx-auto p-4 mt-6">
                            {view === 'registration' && <RegistrationScreen onRegister={handleRegister} />}
                            
                            {view === 'menu' && (
                                <MenuScreen 
                                    onStart={startGame} 
                                    onLeaderboard={() => setView('leaderboard')} 
                                    onAiLab={() => setView('ai-lab')} 
                                    onSafetyLab={() => setView('safety-lab')}
                                    onChatLab={() => setView('ai-chat')}
                                    onEmojiLab={() => setView('emoji-lab')}
                                    onPuzzleLab={() => setView('puzzle-lab')}
                                    onFourColorLab={() => setView('four-color-lab')}
                                    onColorHuntLab={() => setView('color-hunt-lab')}
                                />
                            )}

                            {view === 'leaderboard' && (
                                <LeaderboardScreen leaderboard={leaderboard} onBack={() => setView('menu')} />
                            )}

                            {view === 'emoji-lab' && (
                                <EmojiDrawingLab 
                                    isLoading={isDrawingEmojiLoading}
                                    error={emojiError}
                                    response={emojiResponse}
                                    onAnalyze={handleAnalyzeEmojiDrawing}
                                    onBack={() => setView('menu')}
                                />
                            )}

                            {view === 'puzzle-lab' && (
                                <IttenPuzzleLab 
                                    onBack={() => setView('menu')} 
                                    onVictory={(bonus) => {
                                        setScore(s => s + bonus);
                                        saveScoreToLeaderboard(score + bonus);
                                    }}
                                />
                            )}
                            
                            {view === 'four-color-lab' && (
                                <FourColorLab 
                                    onBack={() => setView('menu')} 
                                    onVictory={(bonus) => {
                                        setScore(s => s + bonus);
                                        saveScoreToLeaderboard(score + bonus);
                                    }}
                                />
                            )}

                            {view === 'color-hunt-lab' && (
                                <ColorHuntLab 
                                    onBack={() => setView('menu')} 
                                    onVictory={(bonus) => {
                                        setScore(s => s + bonus);
                                        saveScoreToLeaderboard(score + bonus);
                                    }}
                                />
                            )}

                            {view === 'ai-chat' && (
                                <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100 flex flex-col h-[600px]">
                                    <div className="bg-gradient-to-r from-indigo-700 to-purple-800 text-white p-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                                        <div className="flex items-center gap-2">
                                            <Icon.MessageSquare />
                                            <div>
                                                <h2 className="text-xl font-bold">Tutor Personale Itten AI ✨</h2>
                                                <p className="text-xs text-indigo-200">Ottieni risposte sulla teoria del colore, contrasti e marketing</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="text-[10px] bg-white/20 text-white px-2 py-0.5 rounded font-bold uppercase tracking-wider">
                                                Materiale didattico Prof. Delfino REGA
                                            </span>
                                            <button onClick={() => setView('menu')} className="bg-white/10 hover:bg-white/20 text-white font-bold py-1.5 px-4 rounded-xl text-xs transition-colors">
                                                Esci
                                            </button>
                                        </div>
                                    </div>

                                    <div className="flex-grow p-4 overflow-y-auto space-y-4 bg-slate-50/50">
                                        {chatMessages.map((msg, idx) => (
                                            <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[80%] rounded-2xl p-4 text-sm ${msg.sender === 'user' ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-700 border border-slate-100 shadow-sm'}`}>
                                                    <p className="whitespace-pre-line leading-relaxed">{msg.text}</p>
                                                </div>
                                            </div>
                                        ))}
                                        {isChatLoading && (
                                            <div className="flex justify-start">
                                                <div className="bg-white text-slate-400 border border-slate-100 p-4 rounded-2xl text-xs font-semibold animate-pulse flex items-center gap-2">
                                                    <Icon.Sparkles /> Il Tutor sta scrivendo...
                                                </div>
                                            </div>
                                        )}
                                        <div ref={chatEndRef} />
                                    </div>

                                    <div className="p-4 bg-white border-t border-slate-100 flex gap-2">
                                        <input 
                                            type="text" 
                                            className="flex-grow p-3.5 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 text-sm"
                                            placeholder="Chiedimi ad esempio: Cos'è il contrasto simultaneo?"
                                            value={chatInput}
                                            onChange={e => setChatInput(e.target.value)}
                                            onKeyDown={e => e.key === 'Enter' && handleSendChatMessage()}
                                        />
                                        <button 
                                            onClick={handleSendChatMessage}
                                            disabled={isChatLoading || !chatInput.trim()}
                                            className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white p-3.5 rounded-xl flex items-center justify-center flex-shrink-0"
                                        >
                                            <Icon.Send />
                                        </button>
                                    </div>
                                </div>
                            )}

                            {view === 'ai-lab' && (
                                <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
                                    <div className="bg-gradient-to-r from-purple-800 to-indigo-800 text-white p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                                        <div>
                                            <span className="text-xs uppercase font-extrabold tracking-widest text-indigo-200 flex items-center gap-1.5">
                                                <Icon.Sparkles /> Innovazione Didattica
                                            </span>
                                            <h2 className="text-2xl font-bold mt-1">Laboratorio Cromatico AI ✨</h2>
                                            <p className="text-slate-200 text-base">Descrivi la tua idea di brand. L'AI analizzerà le risonanze cromatiche legando Itten e Adobe.</p>
                                        </div>
                                        <span className="text-[10px] bg-white/20 text-white px-2.5 py-1 rounded font-bold uppercase tracking-wider shrink-0 text-center">
                                            Materiale didattico Prof. Delfino REGA
                                        </span>
                                    </div>

                                    <div className="p-6 sm:p-8 space-y-6">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div className="md:col-span-2 space-y-4">
                                                <label className="block text-sm font-bold text-slate-700">Descrizione dell'Idea o del Brand</label>
                                                <textarea 
                                                    rows="3"
                                                    className="w-full p-4 border-2 border-slate-200 rounded-2xl outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 transition-all text-sm"
                                                    placeholder="Esempio: Una clinica odontoiatrica moderna per bambini, che vuole trasmettere calma ma anche allegria..."
                                                    value={aiBrandDescription}
                                                    onChange={e => setAiBrandDescription(e.target.value)}
                                                />
                                            </div>
                                            
                                            <div className="space-y-4">
                                                <label className="block text-sm font-bold text-slate-700">Umore & Emozioni Target</label>
                                                <select 
                                                    className="w-full p-4 border-2 border-slate-200 bg-white rounded-2xl outline-none focus:border-indigo-500 transition-all text-sm font-semibold text-slate-700"
                                                    value={aiMood}
                                                    onChange={e => setAiMood(e.target.value)}
                                                >
                                                    <option value="Energia e Innovazione">Energia e Innovazione</option>
                                                    <option value="Calma e Sicurezza professionale">Calma e Sicurezza professionale</option>
                                                    <option value="Lusso ed Eleganza d'élite">Lusso ed Eleganza d'élite</option>
                                                    <option value="Creatività e Divertimento giocoso">Creatività e Divertimento giocoso</option>
                                                    <option value="Naturalezza, Salute e Sostenibilità">Naturalezza, Salute e Sostenibilità</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="flex gap-4">
                                            <button 
                                                onClick={handleGenerateAIPalette}
                                                disabled={isAiLoading || !aiBrandDescription.trim()}
                                                className="bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 text-white font-bold py-4 px-8 rounded-full text-base flex items-center gap-2 shadow-lg"
                                            >
                                                Genera Palette AI
                                            </button>
                                            <button onClick={() => setView('menu')} className="border-2 border-slate-200 hover:bg-slate-50 font-bold py-4 px-6 rounded-full text-sm">
                                                Torna al Menu
                                            </button>
                                        </div>

                                        {isAiLoading && (
                                            <div className="py-12 flex flex-col items-center justify-center space-y-4 border-t border-slate-100 animate-pulse">
                                                <div className="w-12 h-12 rounded-full border-4 border-indigo-600 border-t-transparent animate-spin"></div>
                                                <p className="text-slate-500 text-sm font-semibold flex items-center gap-1.5">
                                                    Elaborazione cromatico-psicologica in corso...
                                                </p>
                                            </div>
                                        )}

                                        {aiError && (
                                            <div className="p-4 bg-red-50 border border-red-100 rounded-2xl flex gap-3 text-red-700 text-sm items-center">
                                                <AlertCircle className="w-5 h-5 flex-shrink-0" />
                                                <p className="font-semibold">{aiError}</p>
                                            </div>
                                        )}

                                        {aiResponse && (
                                            <div className="border-t border-slate-100 pt-8 space-y-6">
                                                <div className="bg-indigo-50 border p-4 rounded-2xl flex items-center justify-between">
                                                    <div>
                                                        <span className="text-xs uppercase font-extrabold text-indigo-500">Nome Palette</span>
                                                        <h3 className="text-xl font-black text-indigo-900 mt-0.5">{aiResponse.paletteName}</h3>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                                                    {aiResponse.colors.map((color, index) => (
                                                        <div key={index} className="bg-slate-50 border border-slate-100 rounded-3xl p-4 flex flex-col h-full shadow-sm">
                                                            <div 
                                                                className="w-full h-24 rounded-2xl mb-3 shadow-inner relative group cursor-pointer"
                                                                style={{ backgroundColor: color.hex }}
                                                                onClick={() => copyToClipboard(color.hex, index)}
                                                            >
                                                                <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity rounded-2xl flex items-center justify-center text-white text-xs font-bold gap-1">
                                                                    Copia HEX
                                                                </div>
                                                            </div>
                                                            <div className="flex-grow space-y-1">
                                                                <h4 className="font-bold text-slate-800 text-sm flex items-center justify-between">
                                                                    <span>{color.name}</span>
                                                                    <span className="text-[10px] uppercase font-bold text-slate-400 bg-slate-200 px-1.5 py-0.5 rounded">
                                                                        {color.role}
                                                                    </span>
                                                                </h4>
                                                                <span className="text-xs font-mono font-semibold text-slate-500 block">{color.hex}</span>
                                                                <p className="text-xs text-slate-600 leading-relaxed pt-1">{color.psychology}</p>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 border-t border-slate-100 pt-6">
                                                    <div className="bg-amber-50/50 border border-amber-100 p-5 rounded-3xl space-y-2">
                                                        <span className="text-xs uppercase font-extrabold text-amber-700 tracking-wider">Contrasto di Itten Consigliato</span>
                                                        <p className="text-sm font-bold text-amber-900">{aiResponse.ittenContrast}</p>
                                                    </div>

                                                    <div className="bg-emerald-50/50 border border-emerald-100 p-5 rounded-3xl space-y-2">
                                                        <span className="text-xs uppercase font-extrabold text-emerald-700 tracking-wider">Impatto Marketing</span>
                                                        <p className="text-sm text-emerald-900 leading-relaxed">{aiResponse.marketingExplanation}</p>
                                                    </div>

                                                    <div className="bg-blue-50/50 border border-blue-100 p-5 rounded-3xl space-y-2">
                                                        <span className="text-xs uppercase font-extrabold text-blue-700 tracking-wider">Regole UX/UI per lo Schermo</span>
                                                        <p className="text-sm text-blue-900 leading-relaxed">{aiResponse.uxTip}</p>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                      </div>
                                </div>
                            )}

                            {view === 'safety-lab' && (
                                <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
                                    <div className="bg-gradient-to-r from-red-700 via-orange-600 to-yellow-600 text-white p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                                        <div>
                                            <span className="text-xs uppercase font-extrabold tracking-widest text-orange-200 flex items-center gap-1.5">
                                                <Icon.ShieldAlert /> Sicurezza sul Lavoro & Codice della Strada
                                            </span>
                                            <h2 className="text-2xl font-bold mt-1">Laboratorio Segnaletica di Sicurezza AI ⚠️</h2>
                                            <p className="text-slate-105 text-sm mt-1">Progetta un cartello normato tramite l'AI, scoprendo l'importanza cruciale dei contrasti ad alta visibilità (UNI EN ISO 7010).</p>
                                        </div>
                                        <span className="text-[10px] bg-white/20 text-white px-2.5 py-1 rounded font-bold uppercase tracking-wider shrink-0 text-center">
                                            Materiale didattico Prof. Delfino REGA
                                        </span>
                                    </div>

                                    <div className="p-6 sm:p-8 space-y-6">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div className="md:col-span-2 space-y-4">
                                                <label className="block text-sm font-bold text-slate-700">Contesto, Pericolo o Rischio</label>
                                                <textarea 
                                                    rows="3"
                                                    className="w-full p-4 border-2 border-slate-200 rounded-2xl outline-none focus:border-red-500 focus:ring-4 focus:ring-red-100 transition-all text-sm"
                                                    placeholder="Esempio: Alta tensione nei pressi di una cabina elettrica..."
                                                    value={safetyScenario}
                                                    onChange={e => setSafetyScenario(e.target.value)}
                                                />
                                            </div>
                                            
                                            <div className="space-y-4">
                                                <label className="block text-sm font-bold text-slate-700">Categoria UNI EN ISO 7010</label>
                                                <select 
                                                    className="w-full p-4 border-2 border-slate-200 bg-white rounded-2xl outline-none focus:border-red-500 transition-all text-sm font-semibold text-slate-700"
                                                    value={safetyCategory}
                                                    onChange={e => setSafetyCategory(e.target.value)}
                                                >
                                                    <option value="Divieto">Divieto (Rosso / Cerchio)</option>
                                                    <option value="Obbligo">Prescrizione / Obbligo (Blu / Cerchio)</option>
                                                    <option value="Avvertimento">Avvertimento / Pericolo (Giallo / Triangolo)</option>
                                                    <option value="Salvataggio e Soccorso">Salvataggio e Soccorso (Verde / Quadrato)</option>
                                                    <option value="Antincendio">Antincendio (Rosso / Quadrato)</option>
                                                    <option value="Segnale Stradale">Segnaletica Stradale di Prescrizione / Pericolo</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="flex gap-4">
                                            <button 
                                                onClick={handleGenerateSafetySign}
                                                disabled={isSafetyLoading || !safetyScenario.trim()}
                                                className="bg-red-600 hover:bg-red-700 disabled:bg-slate-300 text-white font-bold py-4 px-8 rounded-full text-base flex items-center gap-2 shadow-lg"
                                            >
                                                Costruisci Segnale con AI
                                            </button>
                                            <button onClick={() => setView('menu')} className="border-2 border-slate-200 hover:bg-slate-50 font-bold py-4 px-6 rounded-full text-sm">
                                                Torna al Menu
                                            </button>
                                        </div>

                                        {isSafetyLoading && (
                                            <div className="py-12 flex flex-col items-center justify-center space-y-4 border-t border-slate-100 animate-pulse">
                                                <div className="w-12 h-12 rounded-full border-4 border-red-600 border-t-transparent animate-spin"></div>
                                                <p className="text-slate-500 text-sm font-semibold flex items-center gap-1.5">
                                                    Assemblaggio grafico del segnale in corso...
                                                </p>
                                            </div>
                                        )}

                                        {safetyResponse && (
                                            <div className="border-t border-slate-100 pt-8 grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
                                                <div className="md:col-span-4 flex flex-col items-center justify-center p-6 bg-slate-100 rounded-3xl border border-slate-200/50">
                                                    <span className="text-xs uppercase font-extrabold text-slate-400 tracking-wider mb-4">Segnale Vettoriale</span>
                                                    <div className="w-48 h-48 flex items-center justify-center relative">
                                                        <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-lg">
                                                            {safetyResponse.shape === 'triangle' && (
                                                                <polygon points="50,5 95,85 5,85" fill={safetyResponse.bgColor} stroke={safetyResponse.borderColor} strokeWidth="5" />
                                                            )}
                                                            {safetyResponse.shape === 'circle' && (
                                                                <circle cx="50" cy="50" r="45" fill={safetyResponse.bgColor} stroke={safetyResponse.borderColor} strokeWidth="5" />
                                                            )}
                                                            {safetyResponse.shape === 'square' && (
                                                                <rect x="5" y="5" width="90" height="90" rx="10" fill={safetyResponse.bgColor} stroke={safetyResponse.borderColor} strokeWidth="5" />
                                                            )}
                                                            {safetyResponse.shape === 'rectangle' && (
                                                                <rect x="5" y="15" width="90" height="70" rx="8" fill={safetyResponse.bgColor} stroke={safetyResponse.borderColor} strokeWidth="5" />
                                                            )}
                                                            <path d={safetyResponse.symbolPath} fill={safetyResponse.textColor} transform="translate(25, 25) scale(0.5)" />
                                                            {safetyResponse.shape === 'circle' && safetyCategory === 'Divieto' && (
                                                                <line x1="18" y1="18" x2="82" y2="82" stroke={safetyResponse.borderColor} strokeWidth="6" />
                                                            )}
                                                        </svg>
                                                    </div>
                                                    <p className="text-xs text-slate-500 text-center font-semibold mt-4 bg-slate-200 px-3 py-1 rounded-full">
                                                        Icona: {safetyResponse.symbolDescription}
                                                    </p>
                                                </div>

                                                <div className="md:col-span-8 space-y-4">
                                                    <div>
                                                        <span className="text-xs uppercase font-extrabold text-red-600 tracking-wider bg-red-50 px-2.5 py-1 rounded-full">
                                                            {safetyResponse.regulatoryCategory}
                                                        </span>
                                                        <h3 className="text-2xl font-black text-slate-800 mt-2">{safetyResponse.signTitle}</h3>
                                                    </div>

                                                    <div className="p-4 bg-slate-50 rounded-2xl border border-slate-200/50">
                                                        <h4 className="text-sm font-extrabold text-slate-700">Prescrizione Comportamentale</h4>
                                                        <p className="text-sm text-slate-600 leading-relaxed font-semibold mt-1">
                                                            {safetyResponse.behavioralRule}
                                                        </p>
                                                    </div>

                                                    <div className="p-4 bg-indigo-50/60 rounded-2xl border border-indigo-100/60">
                                                        <h4 className="text-sm font-extrabold text-indigo-900">Standard Tecnici & Contrasto</h4>
                                                        <p className="text-sm text-indigo-950 leading-relaxed mt-1 whitespace-pre-line">
                                                            {safetyResponse.technicalStandards}
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {view === 'playing' && (
                                <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
                                    <div className="bg-slate-800 text-white p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                                        <div>
                                            <span className="text-xs uppercase font-extrabold tracking-widest text-indigo-300">Scienza del Colore, Design & Marketing</span>
                                            <h2 className="text-2xl font-bold mt-1 mb-2">{LEVELS_DATA[level].title}</h2>
                                            <p className="text-slate-300 text-base">{LEVELS_DATA[level].desc}</p>
                                        </div>
                                        <span className="text-[10px] bg-white/20 text-white px-2.5 py-1 rounded font-bold uppercase tracking-wider shrink-0 text-center">
                                            Materiale didattico Prof. Delfino REGA
                                        </span>
                                    </div>

                                    <div className="p-4 sm:p-8 relative min-h-[460px] flex flex-col justify-center">
                                        {feedback && (
                                            <div className="absolute inset-0 bg-white/95 backdrop-blur-sm z-20 flex flex-col items-center justify-center p-6 animate-in fade-in duration-300">
                                                {feedback.isCorrect ? (
                                                    <div className="text-green-500 text-5xl mb-2">✓</div>
                                                ) : (
                                                    <div className="text-red-500 text-5xl mb-2">✗</div>
                                                )}
                                                <h3 className={`text-2xl font-bold text-center mb-2 ${feedback.isCorrect ? 'text-green-600' : 'text-red-600'}`}>
                                                    {feedback.isCorrect ? 'Risposta Esatta!' : 'Riprova!'}
                                                </h3>
                                                <p className="text-base sm:text-lg text-slate-600 text-center max-w-lg font-medium leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                    {feedback.message}
                                                </p>
                                            </div>
                                        )}

                                        <div className="w-full">
                                            {LEVELS_DATA[level].type === 'interactive-primaries' && <InteractivePrimaries showFeedback={showFeedback} />}

                { id: 'red', hex: '#EF4444', name: 'Rosso' },

                { id: 'yellow', hex: '#EAB308', name: 'Giallo' },

                { id: 'blue', stroke: '#3B82F6', hex: '#3B82F6', name: 'Blu' }

            const handleSelect = (color) => {
                if (selected.includes(color.id)) {
                    setSelected(selected.filter(id => id !== color.id));
                } else if (selected.length < 3) {
                    const newSelected = [...selected, color.id];
                    setSelected(newSelected);
                    if (newSelected.length === 3) {
                        const isCorrect = newSelected.includes('red') && newSelected.includes('yellow') && newSelected.includes('blue');
                        if (isCorrect) {
                            showFeedback(true, "Esatto! Rosso, Giallo e Blu sono i tre colori primari fondamentali del cerchio di Itten, indivisibili e puri.");

                            showFeedback(false, "Attenzione: hai selezionato dei colori secondari (nati da miscele). Riprova!", 0);

            return (
