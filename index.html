        // --- SUB-COMPONENTE: EMOJIDRAWINGLAB ---
        function EmojiDrawingLab({ isLoading, error, response, onAnalyze, onBack }) {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [brushColor, setBrushColor] = useState('#EAB308'); 
            const [brushSize, setBrushSize] = useState(6);
            const [isEraser, setIsEraser] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (canvas) {
                  const ctx = canvas.getContext('2d');
                  ctx.fillStyle = '#FFFFFF';
                  ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            }, []);

            const getCoordinates = (e) => {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                if (e.touches && e.touches[0]) {
                  return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                  };
                }
                return {
                  x: e.clientX - rect.left,
                  y: e.clientY - rect.top
                };
            };

            const startDrawing = (e) => {
                e.preventDefault();
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'round';
                ctx.strokeStyle = isEraser ? '#FFFFFF' : brushColor;
                setIsDrawing(true);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const { x, y } = getCoordinates(e);
                const ctx = canvasRef.current.getContext('2d');
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const paletteBrushes = [
                { hex: '#EF4444', emotion: 'Rabbia / Passione' },
                { hex: '#EAB308', emotion: 'Gioia / ...' },
                { hex: '#3B82F6', emotion: 'Tristezza / Calma' },
                { hex: '#22C55E', emotion: 'Equilibrio / ...' },
                { hex: '#F97316', emotion: 'Entusiasmo / ...' },
                { hex: '#A855F7', emotion: 'Mistero' },
                { hex: '#000000', emotion: 'Autorità' },
            ];

            return (
                <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100 animate-fade-in">
                    <div className="bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 text-white p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <span className="text-xs uppercase font-extrabold tracking-widest text-pink-100 flex items-center gap-1.5">
                                <Icon.Smile /> Gioco Didattico Interattivo
                            </span>
                            <h2 className="text-2xl font-bold mt-1">Laboratorio Disegno Emoji AI 🎨</h2>
                            <p className="text-slate-100 text-sm mt-1">Disegna sulla lavagna a sinistra: l'AI interpreterà i tuoi tratti cromatici e darà vita ad un'emoji digitale!</p>
                        </div>
                        <span className="text-[10px] bg-white/20 text-white px-2.5 py-1 rounded font-bold uppercase tracking-wider shrink-0 text-center">
                            Materiale didattico Prof. Delfino REGA
                        </span>
                    </div>

                    <div className="p-6 sm:p-8 space-y-6">
                        <div className="grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
                            
                            {/* AREA DI DISEGNO (SINISTRA) */}
                            <div className="md:col-span-6 flex flex-col items-center">
                                <div className="border-4 rounded-3xl overflow-hidden shadow-inner bg-white relative">
                                    <canvas
                                        ref={canvasRef}
                                        width={320}
                                        height={320}
                                        onMouseDown={startDrawing}
                                        onMouseMove={draw}
                                        onMouseUp={() => setIsDrawing(false)}
                                        onMouseLeave={() => setIsDrawing(false)}
                                        onTouchStart={startDrawing}
                                        onTouchMove={draw}
                                        onTouchEnd={() => setIsDrawing(false)}
                                        className="cursor-crosshair touch-none"
                                    />
                                </div>

                                <div className="w-full mt-4 space-y-3 bg-slate-50 p-4 rounded-2xl border">
                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <span className="text-xs font-extrabold text-slate-400">Colore Pennello:</span>
                                        <div className="flex gap-1.5 flex-wrap">
                                            {paletteBrushes.map((brush) => (
                                                <button
                                                    key={brush.hex}
                                                    onClick={() => { setBrushColor(brush.hex); setIsEraser(false); }}
                                                    className="w-8 h-8 rounded-full border border-slate-300"
                                                    style={{ backgroundColor: brush.hex }}
                                                />
                                            ))}
                                            <button onClick={() => setIsEraser(true)} className="p-1.5 rounded-full border">
                                                <Icon.Eraser />
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex gap-3 w-full mt-4">
                                    <button 
                                        onClick={() => {
                                            const canvas = canvasRef.current;
                                            const base64Png = canvas.toDataURL('image/png').split(',')[1];
                                            onAnalyze(base64Png);
                                        }}
                                        disabled={isLoading}
                                        className="flex-grow bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-6 rounded-2xl text-sm"
                                    >
                                        Analizza & Trasforma con AI ✨
                                    </button>
                                    <button onClick={() => {
                                        const canvas = canvasRef.current;
                                        const ctx = canvas.getContext('2d');
                                        ctx.fillStyle = '#FFFFFF';
                                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                                    }} className="p-3.5 rounded-2xl bg-slate-100 hover:bg-slate-200 border text-slate-600">
                                        <Icon.Trash />
                                    </button>
                                </div>
                            </div>

                            <div className="md:col-span-6 space-y-6">
                                <span className="text-sm font-bold text-slate-500 block uppercase tracking-wider">La tua Creazione AI</span>

                                {isLoading && (
                                    <div className="p-8 bg-slate-50/50 rounded-3xl border border-dashed min-h-[340px] flex flex-col items-center justify-center space-y-4 animate-pulse">
                                        <div className="w-12 h-12 rounded-full border-4 border-indigo-600 border-t-transparent animate-spin"></div>
                                        <p className="text-slate-500 text-sm font-semibold">Itten sta interpretando il tuo disegno vettoriale...</p>
                                    </div>
                                )}

                                {error && (
                                    <div className="p-4 bg-red-50 border border-red-150 rounded-2xl flex gap-3 text-red-700 text-xs items-center">
                                        <p className="font-semibold">{error}</p>
                                    </div>
                                )}

                                {response && (
                                    <div className="space-y-4">
                                        <div className="p-6 bg-slate-100 rounded-3xl border flex flex-col items-center">
                                            <div className="w-36 h-36 drop-shadow-xl" dangerouslySetInnerHTML={{ __html: response.svgOutput }} />
                                            <h3 className="text-lg font-black text-indigo-950 mt-4">{response.emojiName}</h3>
                                        </div>

                                        <div className="p-4 bg-rose-50/60 border border-rose-100 rounded-2xl space-y-1.5">
                                            <h4 className="text-xs uppercase font-extrabold text-rose-700">Analisi Psicologica Visiva</h4>
                                            <p className="text-xs text-rose-950 font-medium">{response.psychologicalProfile}</p>
                                        </div>

                                        <div className="p-4 bg-indigo-50/50 border rounded-2xl space-y-1.5">
                                            <h4 className="text-xs uppercase font-extrabold text-indigo-700 font-bold">Colori Rilevati</h4>
                                            <ul className="text-xs text-indigo-900 font-medium space-y-1 list-disc pl-4">
                                                {response.detectedColors.map((colorStr, i) => (
                                                    <li key={i}>{colorStr}</li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="flex justify-end pt-4 border-t border-slate-100">
                            <button onClick={onBack} className="border-2 border-slate-200 hover:bg-slate-50 font-bold py-3 px-6 rounded-2xl text-xs">
                                Torna al Menu Principale
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- SUB-COMPONENTE: ITTENPUZZLELAB ---
        function IttenPuzzleLab({ onBack, onVictory }) {
            const PUZZLE_COLORS = [
                { id: 0, name: "Giallo", hex: "#FFFF00", desc: "Colore primario luminoso, associato alla luce pura e all'energia solare." },
                { id: 1, name: "Giallo-Arancio", hex: "#FFAA00", desc: "Colore terziario che unisce la radiosità del giallo e l'ottimismo dell'arancio." },
                { id: 2, name: "Arancio", hex: "#FF7700", desc: "Colore secondario vivace, stimolante, sinonimo di entusiasmo e calore." },
                { id: 3, name: "Rosso-Arancio", hex: "#FF3300", desc: "Colore terziario saturo, carico di energia termica ed espressività." },
                { id: 4, name: "Rosso", hex: "#FF0000", desc: "Colore primario di eccezionale forza visiva, evoca passione e urgenza." },
                { id: 5, name: "Rosso-Viola", hex: "#CC0066", desc: "Colore terziario che unisce la passionalità del rosso con il mistero del viola." },
                { id: 6, name: "Viola", hex: "#7700AA", desc: "Colore secondario profondo, legato storicamente alla regalità e alla spiritualità." },
                { id: 7, name: "Blu-Viola", hex: "#333399", desc: "Colore terziario scuro e notturno, bilancia freddezza e profondità." },
                { id: 8, name: "Blu", hex: "#0000FF", desc: "Colore primario freddo per eccellenza, evoca pace, fiducia e stabilità." },
                { id: 9, name: "Blu-Verde", hex: "#006666", desc: "Colore terziario raffinato, ricorda gli abissi oceanici e la quiete." },
                { id: 10, name: "Verde", hex: "#009933", desc: "Colore secondario equilibrato e fresco, simbolo della natura e della rigenerazione." },
                { id: 11, name: "Giallo-Verde", hex: "#99CC00", desc: "Colore terziario primaverile, infonde freschezza e dinamismo naturale." }
            ];

            const [placed, setPlaced] = useState(Array(12).fill(null));
            const [tray, setTray] = useState([]);
            const [selectedTrayId, setSelectedTrayId] = useState(null);
            const [activeHint, setActiveHint] = useState(null);
            const [hasWon, setHasWon] = useState(false);

            useEffect(() => {
                resetGame();
            }, []);

            const resetGame = () => {
                setPlaced(Array(12).fill(null));
                setSelectedTrayId(null);
                setActiveHint(null);
                setHasWon(false);
                
                const scrambled = [...PUZZLE_COLORS];
                for (let i = scrambled.length - 1; i > 0; i--) {
                  const j = Math.floor(Math.random() * (i + 1));
                  [scrambled[i], scrambled[j]] = [scrambled[j], scrambled[i]];
                }
                setTray(scrambled);
            };

            const makeWedgePath = (index) => {
                const cx = 125;
                const cy = 125;
                const r_o = 110; 
                const r_i = 75;  

                const centerAngle = -Math.PI / 2 + index * (Math.PI / 6);
                const startAngle = centerAngle - Math.PI / 12;
                const endAngle = centerAngle + Math.PI / 12;

                const x_o1 = cx + r_o * Math.cos(startAngle);
                const y_o1 = cy + r_o * Math.sin(startAngle);
                const x_o2 = cx + r_o * Math.cos(endAngle);
                const y_o2 = cy + r_o * Math.sin(endAngle);

                const x_i1 = cx + r_i * Math.cos(startAngle);
                const y_i1 = cy + r_i * Math.sin(startAngle);
                const x_i2 = cx + r_i * Math.cos(endAngle);
                const y_i2 = cy + r_i * Math.sin(endAngle);

                return `M ${x_o1} ${y_o1} A ${r_o} ${r_o} 0 0 1 ${x_o2} ${y_o2} L ${x_i2} ${y_i2} A ${r_i} ${r_i} 0 0 0 ${x_i1} ${y_i1} Z`;
            };

            // Definizione locale degli handler di drag-and-drop
            const handleDragStartLocal = (e, colorId) => {
                e.dataTransfer.setData("text/plain", colorId.toString());
            };

            const handleDropLocal = (e, slotIndex) => {
                e.preventDefault();
                const draggedId = parseInt(e.dataTransfer.getData("text/plain"), 10);
                attemptPlace(draggedId, slotIndex);
            };

            const attemptPlace = (colorId, slotIndex) => {
                if (colorId === slotIndex) {
                  const updatedPlaced = [...placed];
                  updatedPlaced[slotIndex] = PUZZLE_COLORS[colorId];
                  setPlaced(updatedPlaced);

                  setTray(prev => prev.filter(item => item.id !== colorId));
                  setSelectedTrayId(null);
                  setActiveHint(PUZZLE_COLORS[colorId]);

                  const win = updatedPlaced.every((item) => item !== null);
                  if (win) {
                    setHasWon(true);
                    onVictory(200); 
                  }
                } else {
                  setSelectedTrayId(null);
                  setActiveHint({ error: true, desc: "La tonalità non corrisponde a questa posizione." });
                }
            };

            return (
                <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100 animate-fade-in">
                    <div className="bg-gradient-to-r from-amber-500 via-orange-500 to-yellow-500 text-white p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <span className="text-xs uppercase font-extrabold tracking-widest text-yellow-100 flex items-center gap-1.5">
                                <Icon.Palette /> Laboratorio Didattico Pratico
                            </span>
                            <h2 className="text-2xl font-bold mt-1">Itten Color Puzzle 🧩</h2>
                            <p className="text-slate-100 text-sm mt-1">Trascina le tinte o toccane una e premi sul cerchio per posizionarle!</p>
                        </div>
                        <span className="text-[10px] bg-white/20 text-white px-2.5 py-1 rounded font-bold uppercase tracking-wider shrink-0 text-center">
                            Materiale didattico Prof. Delfino REGA
                        </span>
                    </div>

                    <div className="p-6 sm:p-8 space-y-8">
                        <div className="grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
                            
                            <div className="md:col-span-7 flex flex-col items-center justify-center">
                                <div className="relative w-full max-w-sm aspect-square bg-slate-50 border p-4 rounded-3xl flex items-center justify-center shadow-inner">
                                    <svg viewBox="0 0 250 250" className="w-full h-full drop-shadow-md">
                                        <g>
                                            <polygon points="125,50 189.95,162.5 189.95,87.5" fill="#F97316" stroke="#FFFFFF" strokeWidth="1" />
                                            <polygon points="125,50 60.05,162.5 60.05,87.5" fill="#22C55E" stroke="#FFFFFF" strokeWidth="1" />
                                            <polygon points="60.05,162.5 189.95,162.5 125,200" fill="#A855F7" stroke="#FFFFFF" strokeWidth="1" />
                                            <polygon points="125,125 92.53,106.25 125,50 157.48,106.25" fill="#EAB308" stroke="#FFFFFF" strokeWidth="1" />
                                            <polygon points="125,125 125,162.5 60.05,162.5 92.53,106.25" fill="#3B82F6" stroke="#FFFFFF" strokeWidth="1" />
                                            <polygon points="125,125 157.48,106.25 189.95,162.5 125,162.5" fill="#EF4444" stroke="#FFFFFF" strokeWidth="1" />
                                        </g>

                                        <g>
                                            {Array.from({ length: 12 }).map((_, idx) => {
                                                const isCorrectlyPlaced = placed[idx] !== null;
                                                return (
                                                    <path
                                                        key={idx}
                                                        d={makeWedgePath(idx)}
                                                        fill={isCorrectlyPlaced ? placed[idx].hex : '#E2E8F0'}
                                                        stroke={isCorrectlyPlaced ? '#FFFFFF' : '#CBD5E1'}
                                                        strokeWidth="1.5"
                                                        className="transition-all duration-300 cursor-pointer"
                                                        onDragOver={(e) => e.preventDefault()}
                                                        onDrop={(e) => handleDropLocal(e, idx)}
                                                        onClick={() => {
                                                            if (placed[idx]) {
                                                              setActiveHint(placed[idx]);
                                                            } else if (selectedTrayId !== null) {
                                                              attemptPlace(selectedTrayId, idx);
                                                            }
                                                        }}
                                                    />
                                                );
                                            })}
                                        </g>
                                    </svg>

                                    {hasWon && (
                                        <div className="absolute inset-0 bg-white/95 rounded-3xl flex flex-col items-center justify-center p-6 text-center animate-in fade-in duration-500 z-10">
                                            <Icon.Sparkles />
                                            <h3 className="text-2xl font-black text-indigo-950">Completato con Successo! 🏆</h3>
                                            <div className="bg-yellow-100 text-yellow-900 px-4 py-1 rounded-full text-xs font-black mt-4 animate-pulse">
                                                +200 PUNTI BONUS ACCREDITATI
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="md:col-span-5 space-y-6">
                                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                    <span className="text-sm font-bold text-slate-500 uppercase tracking-wider">Tasselli dei Colori ({tray.length}/12)</span>
                                    <button onClick={resetGame} className="text-slate-500 hover:text-slate-800 p-1.5 bg-slate-100 rounded-xl">
                                        <Icon.Refresh />
                                    </button>
                                </div>

                                {tray.length > 0 && (
                                    <div className="grid grid-cols-3 gap-3 max-h-[220px] overflow-y-auto p-2 bg-slate-50 rounded-2xl border">
                                        {tray.map((color) => (
                                            <div
                                                key={color.id}
                                                draggable
                                                onDragStart={(e) => handleDragStartLocal(e, color.id)}
                                                onClick={() => {
                                                    setSelectedTrayId(color.id);
                                                    setActiveHint(PUZZLE_COLORS[color.id]);
                                                }}
                                                className={`p-3 rounded-2xl flex flex-col items-center justify-center border cursor-grab transition-all ${
                                                    selectedTrayId === color.id ? 'border-indigo-600 bg-indigo-50 shadow-md ring-2 ring-indigo-300' : 'border-slate-200 bg-white shadow-sm'
                                                }`}
                                            >
                                                <div className="w-10 h-10 rounded-full shadow-inner mb-2" style={{ backgroundColor: color.hex }}></div>
                                                <span className="text-[10px] font-black text-slate-700 text-center truncate w-full">{color.name}</span>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <div className="p-5 rounded-2xl border min-h-[120px] flex flex-col justify-center bg-slate-50">
                                    {activeHint ? (
                                        activeHint.error ? (
                                            <div className="space-y-1">
                                                <span className="text-xs uppercase font-extrabold text-red-600 font-bold">Errore</span>
                                                <p className="text-xs text-red-950 font-semibold">{activeHint.desc}</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-1">
                                                <span className="text-[10px] uppercase font-bold text-slate-400">Informazione Colore</span>
                                                <h4 className="text-sm font-black text-slate-800 flex items-center gap-2">
                                                    <span className="inline-block w-3.5 h-3.5 rounded-full" style={{ backgroundColor: activeHint.hex }}></span>
                                                    {activeHint.name}
                                                </h4>
                                                <p className="text-xs text-slate-600 leading-relaxed pt-1">{activeHint.desc}</p>
                                            </div>
                                        )
                                    ) : (
                                        <div className="text-center text-slate-400 space-y-2 py-2">
                                            <p className="text-xs font-semibold leading-relaxed">
                                                Trascina una tinta o selezionala con un click.
                                            </p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        <div className="flex justify-end pt-4 border-t border-slate-100">
                            <button onClick={onBack} className="border-2 border-slate-200 hover:bg-slate-50 font-bold py-3 px-6 rounded-2xl text-xs">
                                Torna al Menu Principale
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Render dell'app React nel root div
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
